name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Compile plugin
        run: python -m compileall -q __init__.py schemas.py workflow.py tests

  hermes-integration:
    name: Hermes isolated integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Prepare package-safe plugin test source
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/plugin-source/hermes_video_agent"
          git -C "$GITHUB_WORKSPACE" archive HEAD | tar -x -C "$RUNNER_TEMP/plugin-source/hermes_video_agent"
      - name: Prepare Hermes test environment
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          python -m venv "$RUNNER_TEMP/hermes-agent/.venv"
          "$RUNNER_TEMP/hermes-agent/.venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/hermes-agent/.venv/bin/python" -m pip install -e "$RUNNER_TEMP/hermes-agent[dev]"
      - name: Run plugin integration test
        run: |
          cd "$RUNNER_TEMP/hermes-agent"
          scripts/run_tests.sh \
            "$RUNNER_TEMP/plugin-source/hermes_video_agent/tests/test_hermes_video_agent.py" \
            -- --rootdir "$RUNNER_TEMP/plugin-source/hermes_video_agent"
