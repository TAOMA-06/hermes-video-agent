name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile plugin
        run: python -m compileall -q __init__.py schemas.py workflow.py tests

  hermes-integration:
    name: Hermes isolated integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Prepare Hermes test environment
        run: |
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git "$RUNNER_TEMP/hermes-agent"
          python -m venv "$RUNNER_TEMP/hermes-agent/.venv"
          "$RUNNER_TEMP/hermes-agent/.venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/hermes-agent/.venv/bin/python" -m pip install -e "$RUNNER_TEMP/hermes-agent[dev]"
      - name: Run plugin integration test
        run: |
          cd "$RUNNER_TEMP/hermes-agent"
          scripts/run_tests.sh "$GITHUB_WORKSPACE/tests/test_hermes_video_agent.py"
